# 医学术语包：同一份数据结构，换成临床研究的说法（数据不动）
schema: cercis.terms/1
profile: medicine
label_cn: 医学术语包
label_en: Clinical terms
tables:
  studies:
    label_cn: 临床研究
    label_en: Clinical study
  factors:
    label_cn: 研究因素
    label_en: Study factor
  treatments:
    label_cn: 干预
    label_en: Intervention
    fields:
      amount: { label_cn: 剂量, label_en: Dose }
  units:
    label_cn: 受试单元
    label_en: Study unit
    fields:
      unit_id: { label_cn: 受试编号, label_en: Subject ID }
