[workspace]
resolver = "2"
members = [
    "crates/plugin-research-template",
    "crates/plugin-research-io",
    "crates/plugin-research-scribe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
calamine = "0.26"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
